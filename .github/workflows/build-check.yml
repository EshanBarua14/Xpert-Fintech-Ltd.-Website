name: build-check
on:
  push:
    branches: [ci/build-check]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p . | sed -E 's/^([^(]+)\(([0-9]+),([0-9]+)\): error (.*)$/::error file=\1,line=\2::\4/' || true
      - run: npx next lint 2>&1 | grep -E 'Error:' -B1 | sed 's/^/::warning::/' || true
      - run: npx next build 2>&1 | tail -150
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/x
          NEXT_TELEMETRY_DISABLED: "1"
