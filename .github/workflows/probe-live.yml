name: probe-live
on:
  push:
    branches: [ci/build-check]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Live media
        run: |
          set +e
          B=https://xpert-fintech-ltd-website.vercel.app
          curl -s -L "$B/en" -o a.html; curl -s -L "$B/en/platform" -o b.html; curl -s -L "$B/en/consortium" -o c.html
          keys=$(cat a.html b.html c.html | grep -oE '%2Fmedia%2F[0-9a-f-]+\.(png|jpg|jpeg|webp|svg|gif)|/media/[0-9a-f-]+\.(png|jpg|jpeg|webp|svg|gif)' | sed 's#%2Fmedia%2F#/media/#' | sort -u)
          ok=0; bad=0; B404=""
          for k in $keys; do c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$B$k"); if [ "$c" = 200 ]; then ok=$((ok+1)); else bad=$((bad+1)); B404="$B404 $c$k"; fi; done
          echo "::notice::direct media: $ok ok, $bad failing:$B404" | cut -c1-3000
          c=$(curl -s -o /dev/null -w '%{http_code}' "$B/brand/xpert-logo.png"); echo "::notice::brand logo direct $c"
          curl -s -D - -o /dev/null "$B/_next/image?url=%2Fbrand%2Fxpert-logo.png&w=64&q=75" | grep -i "x-vercel-error\|HTTP/" | tr '\n' ' ' | sed 's/^/::notice::optimizer /'
