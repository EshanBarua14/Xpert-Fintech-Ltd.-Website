name: probe-live
on:
  push:
    branches: [ci/build-check]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Live images after the fix
        run: |
          set +e
          B=https://xpert-fintech-ltd-website.vercel.app
          T=0; BAD=""; OPT=0
          for p in /en /en/platform /en/consortium /en/company/management /en/products; do
            curl -s -L "$B$p" -o p.html
            OPT=$((OPT + $(grep -o '/_next/image' p.html | wc -l)))
            for u in $(grep -oE 'src="[^"]+"' p.html | sed 's/^src="//; s/"$//; s/&amp;/\&/g' | grep -E '^/(media|brand|_next/image|logos|images)' | sort -u); do
              c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$B$u"); T=$((T+1)); [ "$c" = 200 ] || BAD="$BAD $c$u"
            done
          done
          echo "::notice::images checked $T, optimizer links left $OPT, failing:$BAD" | cut -c1-3000
