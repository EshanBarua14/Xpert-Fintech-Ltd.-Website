name: admin-e2e
on:
  push:
    branches: [ci/build-check]
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xpert
          POSTGRES_PASSWORD: xpert
          POSTGRES_DB: xpert_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xpert" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://xpert:xpert@localhost:5432/xpert_e2e?schema=public
      NEXT_PUBLIC_SITE_URL: https://e2e.example.com
      SESSION_SECRET: e2e-session-secret-0123456789-abcdefghijklmnop
      MARKET_DATA_MODE: none
      SEED_ADMIN_EMAIL: e2e-admin@example.com
      SEED_ADMIN_PASSWORD: e2e-admin-password-123
      E2E_ADMIN_EMAIL: e2e-admin@example.com
      E2E_ADMIN_PASSWORD: e2e-admin-password-123
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy && npx prisma generate
      - run: npx prisma db seed 2>&1 | tail -30
      - run: npm run db:seed:content 2>&1 | tail -30 || true
      - run: npx next build > build.log 2>&1 || (grep -nE "rror|Failed|failed" build.log | head -30 | sed "s/^/::error::/"; tail -40 build.log | sed "s/^/::error::/"; exit 1)
      - run: |
          nohup npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health >/dev/null && break; sleep 2; done
          curl -s http://localhost:3000/api/health; echo
      - run: npx playwright install --with-deps chromium > /dev/null
      - name: Admin end-to-end
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=results.json BASE_URL=http://localhost:3000 npx playwright test e2e/admin-crud.spec.ts --project=desktop --retries=0 --reporter=list,json > e2e.log 2>&1
          echo "exit $?" >> e2e.log
          tail -150 e2e.log
      - name: Save results for review
        if: always()
        run: |
          mkdir -p out && cp e2e.log build.log out/ 2>/dev/null; cp results.json out/ 2>/dev/null; tail -300 server.log > out/server.log 2>/dev/null
          find test-results -name '*.png' | head -40 | while read f; do cp "$f" "out/$(echo $f | tr '/' '_')"; done
          cd out && git init -q -b tmp && git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm "admin e2e $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp:tmp/dse-pages
