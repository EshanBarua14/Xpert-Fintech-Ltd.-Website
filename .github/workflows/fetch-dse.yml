name: fetch-dse
on:
  push:
    branches: [ci/build-check]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (compatible; XpertFintechWebsite/1.0; +https://www.xpertfintech.com)"
          curl -sSL -m 40 -A "$UA" -o dse-home.html https://www.dse.com.bd/ ; echo "home $?"
          curl -sSL -m 40 -A "$UA" -o dse-markets.html https://www.dse.com.bd/markets ; echo "markets $?"
          curl -sSL -m 40 -A "$UA" -o dse-recent.html https://www.dse.com.bd/recent-market-information ; echo "recent $?"
          ls -la
          git init -q -b tmp-dse-pages && git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm "DSE pages $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-dse-pages:tmp/dse-pages
