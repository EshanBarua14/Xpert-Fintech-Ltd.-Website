name: probe-links
# CI only: checks which client web-trading addresses answer, and which trading links client sites carry.
on:
  push:
    branches: [ci/build-check]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: xfltrade web apps
        run: |
          R=""
          for c in ebs sjb snm gdf nls bal ibb one rem sky ubr ibl mika msl mks fcs bcs ssm wif idlc ail; do
            for u in "https://$c.xfltrade.com/app/Login" "https://$c.xfltrade.com/"; do
              out=$(curl -s -L --max-time 15 -o /tmp/p.html -w '%{http_code} %{url_effective}' "$u"); t=$(grep -o -i '<title>[^<]*' /tmp/p.html | head -1 | sed 's/<title>//I')
              R="$R | $c $out [$t]"; break
            done
          done
          echo "::notice::xfl$R"
      - name: client sites
        run: |
          for s in https://www.mikasecurities.net https://www.eblsecurities.com https://nlisecurities.com https://www.onesecuritiesbd.com https://www.remons.org https://www.skylinesecuritiesbd.com/ https://ucbstock.com.bd https://www.ail-bd.com https://www.shahjalalbanksecurities.com.bd https://innovasecurities.com.bd/ https://fcslbd.com https://bluechipsecuritiesltd.com/ https://ssml.com.bd/ https://wifangbd.com/ https://www.basl-bd.com; do
            curl -s -L --max-time 20 "$s" -o /tmp/s.html
            links=$(grep -o -i -E 'href="[^"]*(xfltrade|trade|login|oms|play\.google|apps\.apple)[^"]*"' /tmp/s.html | sort -u | head -12 | tr '\n' ' ')
            echo "::notice::$s → $links"
          done
